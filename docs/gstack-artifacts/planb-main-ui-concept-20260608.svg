<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181b"/>
      <stop offset="1" stop-color="#25211d"/>
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f32"/>
      <stop offset="1" stop-color="#181c1d"/>
    </linearGradient>
    <linearGradient id="battle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#222b28"/>
      <stop offset="1" stop-color="#2d2724"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d0bd75"/>
    </marker>
    <style>
      .label { font-family: Inter, Arial, sans-serif; font-size: 23px; fill: #f1eadc; font-weight: 700; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #d8d2c5; font-weight: 600; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 13px; fill: #aaa396; font-weight: 600; }
      .panel { fill: rgba(28, 32, 34, 0.88); stroke: #655d4e; stroke-width: 2; rx: 8; }
      .slot { fill: #202426; stroke: #7a705d; stroke-width: 2; rx: 6; }
      .pin { fill: #7f897f; opacity: 0.72; }
      .laneText { font-family: Inter, Arial, sans-serif; font-size: 16px; fill: #d9d0bd; font-weight: 700; }
      .badge { fill: #222628; stroke: #6f695b; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Main regions -->
  <rect x="36" y="34" width="500" height="832" rx="14" fill="#141718" stroke="#6d6658" stroke-width="3"/>
  <rect x="564" y="34" width="1000" height="832" rx="14" fill="url(#battle)" stroke="#6d6658" stroke-width="3"/>

  <text x="56" y="72" class="label">Three-Board Ball Machine</text>
  <text x="584" y="72" class="label">Three-Lane Battlefield</text>

  <!-- Forge / Pool / launcher header -->
  <rect x="60" y="92" width="452" height="76" rx="10" fill="#24282a" stroke="#645f52" stroke-width="2"/>
  <text x="82" y="121" class="small">Forge</text>
  <rect x="82" y="134" width="116" height="12" rx="6" fill="#8aa36d"/>
  <text x="226" y="121" class="small">Pool FIFO</text>
  <circle cx="240" cy="144" r="11" fill="#e2c66b"/>
  <circle cx="272" cy="144" r="11" fill="#d4ead1"/>
  <circle cx="304" cy="144" r="11" fill="#9fc0e8"/>
  <circle cx="336" cy="144" r="11" fill="#e2c66b"/>
  <circle cx="368" cy="144" r="11" fill="#565b58"/>
  <path d="M438 136 l28 -12 v40 z" fill="#b7b1a0" stroke="#f1d686" stroke-width="2"/>
  <text x="418" y="121" class="tiny">1.3s</text>

  <!-- Board: Launch -->
  <g transform="translate(60 184)">
    <rect width="452" height="190" rx="10" fill="url(#machine)" stroke="#776e5e" stroke-width="2"/>
    <text x="18" y="34" class="label">Launch</text>
    <text x="18" y="58" class="tiny">supply, split, recycle, waste</text>
    <path d="M227 46 C210 70 224 88 208 112 C196 130 216 148 207 172" stroke="#d9c56c" stroke-width="4" fill="none" filter="url(#softGlow)"/>
    <circle cx="227" cy="46" r="11" fill="#f0d86a" stroke="#fff2a6" stroke-width="2"/>
    <circle cx="90" cy="82" r="5" class="pin"/><circle cx="138" cy="112" r="5" class="pin"/><circle cx="184" cy="78" r="5" class="pin"/>
    <circle cx="256" cy="108" r="5" class="pin"/><circle cx="304" cy="76" r="5" class="pin"/><circle cx="362" cy="118" r="5" class="pin"/>
    <rect x="42" y="150" width="84" height="28" class="slot"/><text x="56" y="170" class="tiny">Tuning</text>
    <rect x="142" y="150" width="76" height="28" class="slot"/><text x="160" y="170" class="tiny">Split</text>
    <rect x="234" y="150" width="92" height="28" class="slot"/><text x="248" y="170" class="tiny">Recycle</text>
    <rect x="342" y="150" width="72" height="28" class="slot"/><text x="356" y="170" class="tiny">Waste</text>
  </g>

  <!-- Board: Tuning -->
  <g transform="translate(60 392)">
    <rect width="452" height="190" rx="10" fill="url(#machine)" stroke="#776e5e" stroke-width="2"/>
    <text x="18" y="34" class="label">Tuning</text>
    <text x="18" y="58" class="tiny">Gate / Prime / Echo / Surge</text>
    <path d="M254 46 C276 76 250 96 278 126 C292 142 282 155 300 170" stroke="#88e36f" stroke-width="5" fill="none" filter="url(#softGlow)"/>
    <circle cx="254" cy="46" r="12" fill="#e9dd8b" stroke="#a7ff8e" stroke-width="3"/>
    <circle cx="96" cy="90" r="5" class="pin"/><circle cx="150" cy="118" r="5" class="pin"/><circle cx="204" cy="86" r="5" class="pin"/>
    <circle cx="274" cy="114" r="5" class="pin"/><circle cx="326" cy="82" r="5" class="pin"/><circle cx="376" cy="120" r="5" class="pin"/>
    <rect x="42" y="150" width="80" height="28" class="slot"/><text x="60" y="170" class="tiny">Gate</text>
    <rect x="138" y="146" width="82" height="34" rx="6" fill="#2d3c2c" stroke="#9df279" stroke-width="3"/><text x="154" y="169" class="tiny" fill="#eaffd8">Prime</text>
    <rect x="236" y="150" width="80" height="28" class="slot"/><text x="256" y="170" class="tiny">Echo</text>
    <rect x="332" y="150" width="80" height="28" class="slot"/><text x="350" y="170" class="tiny">Surge</text>
  </g>

  <!-- Board: Unit -->
  <g transform="translate(60 600)">
    <rect width="452" height="220" rx="10" fill="url(#machine)" stroke="#776e5e" stroke-width="2"/>
    <text x="18" y="34" class="label">Unit</text>
    <text x="18" y="58" class="tiny">slot exposure gate, progress, queue entry</text>
    <path d="M214 50 C190 84 232 108 204 138 C192 150 192 162 194 184" stroke="#dfd37a" stroke-width="4" fill="none" filter="url(#softGlow)"/>
    <circle cx="214" cy="50" r="11" fill="#f0d86a" stroke="#fff2a6" stroke-width="2"/>
    <circle cx="92" cy="88" r="5" class="pin"/><circle cx="142" cy="116" r="5" class="pin"/><circle cx="198" cy="86" r="5" class="pin"/>
    <circle cx="256" cy="120" r="5" class="pin"/><circle cx="316" cy="88" r="5" class="pin"/><circle cx="374" cy="124" r="5" class="pin"/>
    <rect x="38" y="150" width="80" height="52" rx="6" fill="#263326" stroke="#8fd36c" stroke-width="3"/>
    <text x="58" y="170" class="tiny">S1 2/3</text><rect x="52" y="182" width="52" height="8" rx="4" fill="#8fd36c"/>
    <rect x="132" y="150" width="80" height="52" class="slot"/>
    <text x="152" y="170" class="tiny">S2 4/5</text><rect x="146" y="182" width="44" height="8" rx="4" fill="#d8c66b"/>
    <rect x="226" y="150" width="80" height="52" class="slot"/>
    <text x="246" y="170" class="tiny">S3 3/8</text><rect x="240" y="182" width="24" height="8" rx="4" fill="#d8c66b"/>
    <rect x="320" y="150" width="80" height="52" rx="6" fill="#1b1e20" stroke="#6f695b" stroke-width="2"/>
    <path d="M326 150 h68 v52 h-68 z" fill="#2d3030" opacity="0.58"/>
    <text x="340" y="170" class="tiny">S4 0/12</text><text x="338" y="194" class="tiny">gate</text>
  </g>

  <!-- Battlefield lanes: two point bases with three branching routes -->
  <g transform="translate(590 110)">
    <rect width="930" height="690" rx="12" fill="#1e2522" stroke="#554f45" stroke-width="2"/>
    <text x="58" y="298" class="tiny">Player Base</text>
    <text x="790" y="298" class="tiny">Enemy Base</text>

    <!-- Neutral lane roads -->
    <path d="M95 345 C185 245 300 150 455 150 C620 150 715 245 835 345" stroke="#5a5549" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M95 345 C290 345 520 345 835 345" stroke="#5a5549" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M95 345 C185 445 300 540 455 540 C620 540 715 445 835 345" stroke="#5a5549" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M95 345 C185 245 300 150 455 150 C620 150 715 245 835 345" stroke="#222c28" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M95 345 C290 345 520 345 835 345" stroke="#222c28" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M95 345 C185 445 300 540 455 540 C620 540 715 445 835 345" stroke="#222c28" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Selected Deploy Lane on mid path -->
    <path d="M95 345 C290 345 520 345 835 345" stroke="#77d9ff" stroke-width="23" fill="none" opacity="0.28" stroke-linecap="round"/>
    <path d="M122 345 C284 345 500 345 808 345" stroke="#77d9ff" stroke-width="4" fill="none" stroke-dasharray="14 11" marker-end="url(#arrow)"/>
    <text x="610" y="318" class="small" fill="#b9f0ff">Deploy Lane selected</text>

    <text x="350" y="118" class="laneText">Top Lane</text>
    <text x="380" y="326" class="laneText">Mid Lane</text>
    <text x="328" y="580" class="laneText">Bottom Lane</text>

    <!-- Danger cue on top lane -->
    <polygon points="668,202 690,246 646,246" fill="#d26b4a" stroke="#ffd0a8" stroke-width="3"/>
    <polygon points="710,202 732,246 688,246" fill="#d26b4a" stroke="#ffd0a8" stroke-width="3"/>
    <text x="650" y="270" class="small" fill="#ffd0a8">Danger 2</text>

    <!-- Point bases -->
    <circle cx="95" cy="345" r="38" fill="#25302b" stroke="#8fc08b" stroke-width="5"/>
    <circle cx="95" cy="345" r="10" fill="#dcefcf"/>
    <circle cx="835" cy="345" r="44" fill="#332522" stroke="#d26b4a" stroke-width="5"/>
    <circle cx="835" cy="345" r="12" fill="#f3c1a5"/>

    <!-- Units and enemies top path -->
    <g fill="#8fc08b" stroke="#dcefcf" stroke-width="2">
      <ellipse cx="278" cy="218" rx="24" ry="13"/>
      <ellipse cx="338" cy="184" rx="24" ry="13"/>
    </g>
    <g fill="#b66f53" stroke="#f3c1a5" stroke-width="2">
      <rect x="610" y="178" width="34" height="24" rx="8"/>
      <rect x="660" y="210" width="34" height="24" rx="8"/>
    </g>

    <!-- Units and enemies mid path -->
    <g fill="#8fc08b" stroke="#dcefcf" stroke-width="2">
      <ellipse cx="258" cy="356" rx="28" ry="15"/>
      <ellipse cx="330" cy="350" rx="36" ry="18"/>
      <ellipse cx="396" cy="354" rx="24" ry="13"/>
    </g>
    <path d="M398 330 C438 312 470 314 506 332" stroke="#a7ff8e" stroke-width="4" fill="none" filter="url(#softGlow)"/>
    <text x="420" y="308" class="tiny" fill="#b9f0ff">Prime hit -> queue pressure</text>
    <g fill="#b66f53" stroke="#f3c1a5" stroke-width="2">
      <rect x="570" y="332" width="38" height="26" rx="8"/>
      <rect x="636" y="332" width="38" height="26" rx="8"/>
    </g>

    <!-- Units and enemies bottom path -->
    <g fill="#8fc08b" stroke="#dcefcf" stroke-width="2">
      <ellipse cx="246" cy="470" rx="24" ry="13"/>
      <ellipse cx="330" cy="514" rx="24" ry="13"/>
    </g>
    <g fill="#b66f53" stroke="#f3c1a5" stroke-width="2">
      <rect x="538" y="516" width="34" height="24" rx="8"/>
    </g>
  </g>

  <!-- Queue bridge -->
  <rect x="522" y="642" width="106" height="150" rx="10" fill="#202425" stroke="#d0bd75" stroke-width="3"/>
  <text x="550" y="672" class="small">Queue</text>
  <rect x="552" y="696" width="52" height="28" rx="6" fill="#7fa85a"/>
  <text x="560" y="716" class="tiny">S1</text>
  <rect x="552" y="734" width="52" height="28" rx="6" fill="#a88e5a"/>
  <text x="560" y="754" class="tiny">S2</text>
  <text x="544" y="782" class="tiny">next 0.5s</text>
  <path d="M628 710 C660 650 668 540 694 455" stroke="#d0bd75" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Bottom HUD -->
  <rect x="564" y="818" width="1000" height="48" rx="10" fill="#1c2021" stroke="#6b6254" stroke-width="2"/>
  <rect x="588" y="830" width="160" height="24" class="badge"/><text x="604" y="848" class="tiny">Battle 3: Counter warning</text>
  <rect x="770" y="830" width="156" height="24" class="badge"/><text x="786" y="848" class="tiny">Pool / Echo / Queue</text>
  <rect x="948" y="830" width="190" height="24" class="badge"/><text x="964" y="848" class="tiny">Result tags enabled</text>
  <rect x="1160" y="830" width="188" height="24" class="badge"/><text x="1176" y="848" class="tiny">Gold 12, shop later</text>

  <text x="58" y="852" class="tiny">Concept UI from current docs, not final art. Left: machine causality. Right: lane commitment and battle state.</text>
</svg>
